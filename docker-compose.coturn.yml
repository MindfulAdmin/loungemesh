# Deployed to: /opt/loungemesh/docker-compose.coturn.yml
#
#   cd /opt/loungemesh && docker compose -f docker-compose.coturn.yml up -d
#
# TURN relay for clients whose network blocks UDP to the bridge on 10000.
# Uses host networking: coturn allocates relay ports dynamically within
# min-port/max-port, which is impractical to express as Docker port mappings.

services:
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: mindfulmeet-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./docker/coturn/certs:/etc/coturn/certs:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 3478 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
