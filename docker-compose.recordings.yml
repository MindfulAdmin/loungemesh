# Shim: prefer recordings-app/docker-compose.recordings.yml
# Kept for older runbook commands that use -f docker-compose.recordings.yml from /opt/loungemesh
name: mindfulmeet-recordings
services:
  recordings-ui:
    build:
      context: ./recordings-app
      dockerfile: Dockerfile
    image: mindfulmeet-recordings:1.0.0
    container_name: mindfulmeet-recordings-ui
    restart: unless-stopped
    user: "0:0"
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      NODE_ENV: production
      PORT: "8088"
      BASE_PATH: /recordings
      DATA_DIR: /data
      PASSWORD_FILE: /run/secrets/recordings-password
      LOGO_FILE: /branding/mindful-logo-dark.png
      FAVICON_FILE: /branding/mindful-favicon.png
      SESSION_SECRET: ${RECORDINGS_SESSION_SECRET}
      JIBRI_HEALTH_URL: http://jibri:2222/jibri/api/v1.0/health
      TRASH_TTL_MS: "604800000"
    volumes:
      - ./docker/jitsi-config/storage/jibri/recordings:/data
      - ./branding/.recordings-password:/run/secrets/recordings-password
      - ./branding/mindful-logo-dark.png:/branding/mindful-logo-dark.png:ro
      - ./branding/mindful-logo-white.png:/branding/mindful-logo-white.png:ro
      - ./branding/mindful-favicon.png:/branding/mindful-favicon.png:ro
      - ./recordings-app/public:/app/public:ro
    networks:
      - default
      - jitsi
networks:
  jitsi:
    external: true
    name: loungemesh_meet.jitsi
