# LoungeMesh (Vue SPA) + local Jitsi Meet (docker-jitsi-meet stack).
#
#   docker compose up -d --build
#
# LoungeMesh UI: http://127.0.0.1:8780
# Jitsi web:    http://127.0.0.1:8001  (PUBLIC_URL in .env)
#
# Image versions are pinned here so Dependabot can open update PRs automatically.
# Do NOT use ${JITSI_IMAGE_VERSION} or floating tags like :stable — pin explicitly.

services:
  loungemesh:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_JITSI_PUBLIC_URL: ${VITE_JITSI_PUBLIC_URL:-http://127.0.0.1:8001}
        VITE_XMPP_DOMAIN: ${XMPP_DOMAIN:-meet.jitsi}
        VITE_XMPP_MUC_DOMAIN: ${XMPP_MUC_DOMAIN:-muc.meet.jitsi}
        VITE_USE_WEBSOCKET: "true"
        VITE_DISABLE_STUN_TURN_DISCOVERY: ${VITE_DISABLE_STUN_TURN_DISCOVERY:-true}
        VITE_EVENTYAY_API_BASE: ${VITE_EVENTYAY_API_BASE-}
        VITE_SESSION_PREFIX: ${VITE_SESSION_PREFIX-}
        VITE_JITSI_XMPP_USER: ${VITE_JITSI_XMPP_USER:-}
        VITE_JITSI_XMPP_PASSWORD: ${VITE_JITSI_XMPP_PASSWORD:-}
    ports:
      - "127.0.0.1:${LOUNGEMESH_PORT:-8780}:80"
      - "[::1]:${LOUNGEMESH_PORT:-8780}:80"
    depends_on:
      jitsi-web:
        condition: service_started
      server:
        condition: service_started
    environment:
      NGINX_ALLOW_IFRAME_FROM: ${NGINX_ALLOW_IFRAME_FROM:-http://localhost:8000 http://127.0.0.1:8000 http://localhost:8880 https://eventyay.com https://*.eventyay.com}
    restart: unless-stopped
    # Join the jitsi network so nginx can proxy /libs/ to the jitsi-web container
    # (lib-jitsi-meet is served from there, never bundled as a static file).
    volumes:
      - ./branding/mindful-favicon-office.png:/usr/share/nginx/html/favicon.png:ro
      - ./branding/mindful-favicon-office.png:/usr/share/nginx/html/apple-touch-icon.png:ro
      - ./branding/favicon-office.svg:/usr/share/nginx/html/favicon.svg:ro
      - ./branding/mindful-og-office.png:/usr/share/nginx/html/mindful-logo.png:ro
    networks:
      meet.jitsi:

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ALLOWED_OAUTH_ORIGINS=${ALLOWED_OAUTH_ORIGINS}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks:
      meet.jitsi:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loungemesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loungemesh}
      POSTGRES_DB: ${POSTGRES_DB:-loungemesh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      meet.jitsi:

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      meet.jitsi:

  jitsi-web:
    image: jitsi/web:stable-10888
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${HTTP_PORT:-8001}:80"
      - "${HTTPS_PORT:-8444}:443"
    volumes:
      - ${CONFIG:-./docker/jitsi-config}/web:/config:Z
      - ${CONFIG:-./docker/jitsi-config}/web/crontabs:/var/spool/cron/crontabs:Z
      - ${CONFIG:-./docker/jitsi-config}/transcripts:/usr/share/jitsi-meet/transcripts:Z
      - ./branding/mindful-logo.png:/usr/share/jitsi-meet/images/mindful-logo.png:ro
      - ./branding/mindful-og-meet.png:/usr/share/jitsi-meet/images/mindful-og.png:ro
      - ./branding/mindful-favicon-meet.png:/usr/share/jitsi-meet/images/mindful-favicon.png:ro
      - ./branding/mindful-logo.png:/usr/share/jitsi-meet/images/watermark.png:ro
      - ./branding/mindful-logo.png:/usr/share/jitsi-meet/images/rightwatermark.png:ro
      - ./branding/mindful-favicon-meet.png:/usr/share/jitsi-meet/images/favicon.svg:ro
      - ./branding/mindful-favicon-meet.png:/usr/share/jitsi-meet/favicon.ico:ro
      - ./branding/mindful-favicon-meet.png:/usr/share/jitsi-meet/apple-touch-icon.png:ro
      - ./branding/welcome-background.jpg:/usr/share/jitsi-meet/images/welcome-background.jpg:ro
      - ./branding/title.html:/usr/share/jitsi-meet/title.html:ro
      - ./branding/index.html:/usr/share/jitsi-meet/index.html:ro
      - ./branding/lang/main.json:/usr/share/jitsi-meet/lang/main.json:ro
      - ./branding/lang/main-en.json:/usr/share/jitsi-meet/lang/main-en.json:ro
      - ./branding/all.css:/usr/share/jitsi-meet/css/all.css:ro
      - ./branding/mindful-welcome.css:/usr/share/jitsi-meet/css/mindful-welcome.css:ro
      - ./branding/app.bundle.min.js:/usr/share/jitsi-meet/libs/app.bundle.min.js:ro
    env_file:
      - .env
    depends_on:
      jvb:
        condition: service_started
    networks:
      meet.jitsi:

  prosody:
    image: jitsi/prosody:stable-10888
    restart: ${RESTART_POLICY:-unless-stopped}
    expose:
      - "5222"
      - "5269"
      - "5347"
      - "5280"
    volumes:
      - ${CONFIG:-./docker/jitsi-config}/prosody/config:/config:Z
      - ${CONFIG:-./docker/jitsi-config}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
    env_file:
      - .env
    depends_on: {}
    networks:
      meet.jitsi:
        aliases:
          - ${XMPP_SERVER:-xmpp.meet.jitsi}

  jicofo:
    image: jitsi/jicofo:stable-10888
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "127.0.0.1:${JICOFO_REST_PORT:-8888}:8888"
    volumes:
      - ${CONFIG:-./docker/jitsi-config}/jicofo:/config:Z
    env_file:
      - .env
    depends_on:
      prosody:
        condition: service_started
    networks:
      meet.jitsi:

  jvb:
    image: jitsi/jvb:stable-10888
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
      - "127.0.0.1:${JVB_COLIBRI_PORT:-8090}:8080"
    volumes:
      - ${CONFIG:-./docker/jitsi-config}/jvb:/config:Z
    env_file:
      - .env
    depends_on:
      prosody:
        condition: service_started
    networks:
      meet.jitsi:

  jibri:
    image: jitsi/jibri:stable-10888
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - ${CONFIG:-./docker/jitsi-config}/jibri:/config:Z
      - ${CONFIG:-./docker/jitsi-config}/storage/jibri:/storage:Z
    shm_size: '2gb'
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    environment:
      - DISPLAY=:0
    env_file:
      - .env
    depends_on:
      jicofo:
        condition: service_started
    networks:
      meet.jitsi:


networks:
  meet.jitsi:

volumes:
  postgres_data:
  redis_data:
