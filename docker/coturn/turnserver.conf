# Deployed to: /opt/loungemesh/docker/coturn/turnserver.conf
# Restart the coturn container after edits.
#
# Purpose: give clients a media path when their network blocks UDP to
# 91.99.230.113:10000. Without TURN those users lose audio and video entirely
# on both Office and Meet, with no fallback.

listening-port=3478
tls-listening-port=5349

# Single public IPv4; coturn must advertise it rather than the container address.
external-ip=91.99.230.113

realm=meet.mindfuldesign.me
server-name=meet.mindfuldesign.me

# Time-limited credentials derived from a shared secret. Prosody hands these to
# clients over XEP-0215 (external_services), so no static user accounts exist.
use-auth-secret
static-auth-secret=eb71b8621ef857392292c751ffabd7e29e7b3fc11ede2cec190e366d994dbf61

# Certificate is copied from Caddy's store by ~/bin/sync-turn-certs.sh, which
# also restarts this container when the cert changes after renewal.
cert=/etc/coturn/certs/cert.pem
pkey=/etc/coturn/certs/key.pem

# Relay allocations. Keep the range small and open exactly this range in ufw.
min-port=49160
max-port=49200

# This is a relay for our own conferences, not an open proxy.
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Block relaying to private ranges so a client cannot reach internal services
# (including the Docker networks on this host) through the TURN server.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# ...but allow the bridge itself, which is the only peer that matters.
allowed-peer-ip=91.99.230.113

# Modest per-user limits; this serves one small team.
user-quota=12
total-quota=100

log-file=stdout
